<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Traffic Analysis</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js & Plotly -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Modern Cyber Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-halved me-2"></i>Network Traffic Analysis
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link nav-btn" href="/">
                            <i class="fas fa-chart-pie me-1 text-info"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn" href="/protocols">
                            <i class="fas fa-layer-group me-1" style="color: #a855f7;"></i>Protocols
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn" href="/dns">
                            <i class="fas fa-globe me-1 text-warning"></i>DNS Monitor
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn" href="/tcp">
                            <i class="fas fa-network-wired me-1 text-primary"></i>TCP Analysis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn" href="/mitre">
                            <i class="fas fa-crosshairs me-1 text-danger"></i>MITRE ATT&CK
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn" href="/hunting">
                            <i class="fas fa-search-location me-1 text-warning"></i>Threat Hunting
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn" href="/visualizations">
                            <i class="fas fa-chart-line me-1 text-success"></i>Visualizations
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
